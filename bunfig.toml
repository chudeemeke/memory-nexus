[test]
# Coverage configuration
coverage = true
coverageDir = "coverage"
coverageSkipTestFiles = true

# Exclude specific directories or files from coverage reports
coveragePathIgnorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/tests/**",
  "**/*.test.ts",
  "**/*.coverage.test.ts"
]

preload = ["./tests/test-setup.ts"]

# Bun 1.4.1 (Windows) and 1.3.14 (Linux) ignore test.timeout here.
# Use `bun run test` or `bun test --timeout 15000` for the quality timeout.
